<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ticker</title>
    
    <!-- PWA & iOS Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ticker">
    <meta name="theme-color" content="#030303">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="mobile.css">
</head>
<body>
    <div class="mobile-container">
        <!-- Masthead -->
        <header class="mobile-header">
            <div class="brand-row">
                <div class="brand-title">TICKER</div>
                <div class="header-status">
                    <div id="sync-indicator" class="status-pill status-offline">
                        <span class="status-dot"></span>
                        <span id="sync-text" class="status-text">CONNECTING</span>
                    </div>
                </div>
            </div>
            
            <!-- Part 1: Quick Calculators Module (Desktop Aligned) -->
            <section class="mobile-calc-module">
                <div class="calc-mode-switch">
                    <button type="button" id="m-mode-target" class="calc-mode-btn active" data-mode="target">TARGET PROJECTION</button>
                    <button type="button" id="m-mode-delta" class="calc-mode-btn" data-mode="delta">PERCENTAGE DELTA</button>
                </div>

                <!-- 1. Target Projection View -->
                <div id="m-panel-target" class="calc-sub-panel">
                    <div class="calc-grid-row">
                        <div class="calc-input-wrap">
                            <span class="calc-label">SYMBOL</span>
                            <input type="text" id="m-target-symbol" class="calc-input mono" placeholder="e.g. 300775 / AAPL" autocomplete="off" autocorrect="off" autocapitalize="characters" />
                        </div>
                        <div class="calc-input-wrap">
                            <div class="calc-label-row">
                                <span class="calc-label">ENTRY PRICE</span>
                                <button type="button" id="m-target-rev-btn" class="calc-inline-link">REV. CALC</button>
                            </div>
                            <div class="calc-cur-input-box">
                                <span id="m-target-cur" class="calc-cur-sym">¥</span>
                                <input type="number" inputmode="decimal" id="m-target-base" class="calc-input mono" placeholder="0.00" step="any" />
                            </div>
                        </div>
                    </div>

                    <div class="calc-grid-row">
                        <div class="calc-input-wrap">
                            <span class="calc-label">MOVEMENT</span>
                            <div class="calc-perc-wrap">
                                <button type="button" id="m-target-dir-btn" class="calc-dir-btn is-up" data-dir="up">▲ UP</button>
                                <div class="calc-perc-inner">
                                    <input type="number" inputmode="decimal" id="m-target-perc" class="calc-input mono" placeholder="0.00" step="any" />
                                    <span class="calc-unit mono">%</span>
                                </div>
                            </div>
                        </div>
                        <div class="calc-input-wrap">
                            <span class="calc-label">LABEL</span>
                            <input type="text" id="m-target-type" class="calc-input" placeholder="D买点1" />
                        </div>
                    </div>

                    <!-- Label Quick Chips -->
                    <div id="m-target-chips-container" class="calc-label-chips-row"></div>

                    <!-- Result & Save Action Bar -->
                    <div class="calc-footer-row">
                        <div class="calc-res-box">
                            <div class="calc-res-left">
                                <span class="calc-res-label">TARGET PRICE</span>
                                <div id="m-target-res-val" class="calc-res-text mono">¥0.00</div>
                            </div>
                            <button type="button" id="m-target-use-entry-btn" class="calc-inline-link">USE AS ENTRY</button>
                        </div>
                        <div class="calc-actions-box">
                            <button type="button" id="m-target-save-btn" class="calc-primary-btn">SAVE PROJECTION</button>
                            <button type="button" id="m-target-clear-btn" class="calc-ghost-btn">CLEAR</button>
                        </div>
                    </div>
                </div>

                <!-- 2. Percentage Delta View -->
                <div id="m-panel-delta" class="calc-sub-panel hidden">
                    <div class="calc-grid-row">
                        <div class="calc-input-wrap">
                            <span class="calc-label">SYMBOL</span>
                            <input type="text" id="m-delta-symbol" class="calc-input mono" placeholder="e.g. 300775 / AAPL" autocomplete="off" autocorrect="off" autocapitalize="characters" />
                        </div>
                        <div class="calc-input-wrap">
                            <div class="calc-label-row">
                                <span class="calc-label">INITIAL PRICE</span>
                                <button type="button" id="m-delta-rev-init-btn" class="calc-inline-link">REV. CALC</button>
                            </div>
                            <div class="calc-cur-input-box">
                                <span id="m-delta-cur-1" class="calc-cur-sym">¥</span>
                                <input type="number" inputmode="decimal" id="m-delta-initial" class="calc-input mono" placeholder="0.00" step="any" />
                            </div>
                        </div>
                    </div>

                    <div class="calc-grid-row">
                        <div class="calc-input-wrap">
                            <div class="calc-label-row">
                                <span class="calc-label">FINAL PRICE</span>
                                <button type="button" id="m-delta-rev-final-btn" class="calc-inline-link">REV. CALC</button>
                            </div>
                            <div class="calc-cur-input-box">
                                <span id="m-delta-cur-2" class="calc-cur-sym">¥</span>
                                <input type="number" inputmode="decimal" id="m-delta-final" class="calc-input mono" placeholder="0.00" step="any" />
                            </div>
                        </div>
                        <div class="calc-input-wrap">
                            <span class="calc-label">LABEL</span>
                            <input type="text" id="m-delta-type" class="calc-input" placeholder="D卖点1" />
                        </div>
                    </div>

                    <!-- Label Quick Chips -->
                    <div id="m-delta-chips-container" class="calc-label-chips-row"></div>

                    <!-- Result & Save Action Bar -->
                    <div class="calc-footer-row">
                        <div class="calc-res-box">
                            <div class="calc-res-left">
                                <span class="calc-res-label">PERCENTAGE DELTA</span>
                                <div id="m-delta-res-val" class="calc-res-text mono">0.00%</div>
                            </div>
                            <button type="button" id="m-delta-use-target-btn" class="calc-inline-link">USE AS TARGET</button>
                        </div>
                        <div class="calc-actions-box">
                            <button type="button" id="m-delta-save-btn" class="calc-primary-btn">SAVE DELTA</button>
                            <button type="button" id="m-delta-clear-btn" class="calc-ghost-btn">CLEAR</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Search & Market Filters -->
            <div class="controls-row">
                <div class="search-box">
                    <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="mobile-search-input" placeholder="Search symbol or name..." class="mono">
                    <button id="clear-search-btn" class="clear-btn">&times;</button>
                </div>
                <div id="market-filter-container" class="market-filter-tabs">
                    <button class="filter-tab active" data-filter="all">ALL</button>
                    <button class="filter-tab" data-filter="US">US</button>
                    <button class="filter-tab" data-filter="CN">A股</button>
                </div>
                <div id="mobile-quick-tags" class="mobile-quick-tags"></div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="mobile-feed">
            <div id="stocks-container" class="cards-stack">
                <!-- Dynamic cards populated by mobile.js -->
            </div>

            <div id="empty-state" class="empty-state hidden">
                <div class="empty-title">NO MATCHING SYMBOLS</div>
                <div class="empty-desc">Check your search filter or add symbols on desktop.</div>
            </div>
        </main>

        <footer class="mobile-footer">
            <div class="footer-line"></div>
            <div class="footer-info">
                <span>STUDIO NOIR</span>
                <span class="mono">TICKER MOBILE v5.3.0</span>
            </div>
        </footer>
    </div>

    <!-- Top Dynamic Island Tap Sensor for Scroll to Top -->
    <div id="top-scroll-sensor" class="top-scroll-sensor" aria-label="Scroll to top"></div>

    <!-- Studio Noir Floating Scroll-To-Top Button -->
    <button id="scroll-to-top-btn" class="scroll-to-top-btn hidden" aria-label="Scroll to top" title="Back to top">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
    </button>

    <!-- Alert Banner (Studio Noir Pure Dark) -->
    <div id="alert-banner" class="alert-banner hidden">
        <div class="alert-banner-inner">
            <div id="alert-banner-text" class="alert-text mono"></div>
            <button id="alert-banner-close" class="alert-close" aria-label="Close">&times;</button>
        </div>
    </div>

    <!-- Backdrop -->
    <div id="edit-sheet-backdrop" class="sheet-backdrop hidden"></div>

    <!-- 1. Stock Metadata Edit Sheet -->
    <div id="stock-edit-sheet" class="bottom-sheet hidden">
        <div class="sheet-handle-bar"></div>
        <div class="sheet-header">
            <div class="sheet-title-tag">EDIT STOCK METADATA</div>
            <div id="stock-sheet-subtitle" class="sheet-symbol mono">--</div>
        </div>
        <div class="sheet-body">
            <div class="sheet-row-dual">
                <div class="sheet-field-group flex-1">
                    <label class="sheet-label">SYMBOL</label>
                    <input id="stock-edit-symbol" type="text" class="sheet-input mono" placeholder="300775" />
                </div>
                <div class="sheet-field-group flex-1">
                    <label class="sheet-label">NAME</label>
                    <input id="stock-edit-name" type="text" class="sheet-input" placeholder="三角防务" />
                </div>
            </div>

            <div class="sheet-row-dual">
                <div class="sheet-field-group flex-1">
                    <label class="sheet-label">COST</label>
                    <input id="stock-edit-cost" type="number" inputmode="decimal" class="sheet-input mono" placeholder="36.215" step="0.001" />
                </div>
                <div class="sheet-field-group flex-1">
                    <label class="sheet-label">QTY</label>
                    <input id="stock-edit-qty" type="number" inputmode="numeric" class="sheet-input mono" placeholder="2400" />
                </div>
            </div>

            <div class="sheet-field-group">
                <label class="sheet-label">W</label>
                <input id="stock-edit-tf-w" type="text" class="sheet-input" placeholder="W time-frame notes..." />
            </div>

            <div class="sheet-field-group">
                <label class="sheet-label">D</label>
                <input id="stock-edit-tf-d" type="text" class="sheet-input" placeholder="D time-frame notes..." />
            </div>

            <div class="sheet-field-group">
                <label class="sheet-label">30</label>
                <input id="stock-edit-tf-30" type="text" class="sheet-input" placeholder="30m time-frame notes..." />
            </div>

            <div class="sheet-field-group flex-grow-notes">
                <label class="sheet-label">STRATEGY &amp; TRADING NOTES</label>
                <textarea id="stock-edit-note" class="sheet-textarea large-note-textarea" placeholder="Strategy & trading notes..."></textarea>
            </div>
        </div>
        <div class="sheet-footer">
            <button id="stock-delete-btn" class="sheet-btn sheet-btn-danger">DELETE STOCK</button>
            <button id="stock-cancel-btn" class="sheet-btn sheet-btn-cancel">CANCEL</button>
            <button id="stock-save-btn" class="sheet-btn sheet-btn-save">SAVE &amp; SYNC</button>
        </div>
    </div>

    <!-- 2. Calculation Target Edit Sheet -->
    <div id="calc-edit-sheet" class="bottom-sheet hidden">
        <div class="sheet-handle-bar"></div>
        <div class="sheet-header">
            <div class="sheet-title-tag">EDIT CALCULATION TARGET</div>
            <div id="calc-sheet-subtitle" class="sheet-symbol mono">--</div>
        </div>
        <div class="sheet-body">
            <div class="sheet-field-group">
                <label class="sheet-label">TYPE LABEL</label>
                <input id="calc-edit-type" type="text" class="sheet-input mono" placeholder="Select tag or type custom label" />
                <div id="calc-chips-container" class="chips-scroll-row">
                    <!-- Dynamic custom labels from appState -->
                </div>
            </div>

            <div class="sheet-row-dual">
                <div class="sheet-field-group flex-1">
                    <label class="sheet-label">BASE PRICE</label>
                    <input id="calc-edit-base" type="number" inputmode="decimal" class="sheet-input mono" placeholder="0.00" step="0.01" />
                </div>
                <div class="sheet-field-group flex-1">
                    <label class="sheet-label">TARGET PRICE</label>
                    <input id="calc-edit-target" type="number" inputmode="decimal" class="sheet-input mono" placeholder="0.00" step="0.01" />
                </div>
            </div>

            <div class="sheet-row-dual">
                <div class="sheet-field-group flex-1">
                    <label class="sheet-label">MOVEMENT</label>
                    <div class="sheet-perc-row">
                        <button id="calc-edit-dir-btn" class="dir-toggle-btn" data-dir="up">▲ UP</button>
                        <input id="calc-edit-perc" type="number" inputmode="decimal" class="sheet-input mono" placeholder="0.0" step="0.1" />
                        <span class="perc-unit mono">%</span>
                    </div>
                </div>
                <div class="sheet-field-group flex-1">
                    <label class="sheet-label">SHARES</label>
                    <input id="calc-edit-shares" type="number" inputmode="numeric" class="sheet-input mono" placeholder="Optional shares" />
                </div>
            </div>

            <div class="sheet-field-group">
                <div class="sheet-toggle-row">
                    <label class="sheet-label" style="margin: 0;">HIGHLIGHT</label>
                    <input id="calc-edit-highlight" type="checkbox" class="noir-checkbox" />
                </div>
            </div>
        </div>
        <div class="sheet-footer">
            <button id="calc-delete-btn" class="sheet-btn sheet-btn-danger">DELETE TARGET</button>
            <button id="calc-cancel-btn" class="sheet-btn sheet-btn-cancel">CANCEL</button>
            <button id="calc-save-btn" class="sheet-btn sheet-btn-save">SAVE &amp; SYNC</button>
        </div>
    </div>

    <script src="mobile.js"></script>
</body>
</html>
